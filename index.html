<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LAN Chat</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel-2: #1a2230;
    --border: #263140;
    --text: #e8edf3;
    --text-dim: #8fa1b3;
    --accent: #3ba7ff;
    --accent-2: #2f6fed;
    --sent: #2f6fed;
    --recv: #1e2a3a;
    --ok: #35d68a;
    --warn: #ffb547;
    --err: #ff5f6d;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #16202e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* Join screen */
  #joinScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 16px;
    text-align: center;
  }
  #joinScreen .icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(59,167,255,0.35);
  }
  #joinScreen .icon svg { width: 28px; height: 28px; }
  #joinScreen h1 { margin: 0; font-size: 20px; }
  #joinScreen p { margin: 0; color: var(--text-dim); font-size: 13.5px; max-width: 320px; line-height: 1.5; }
  #nameInput {
    width: 100%; max-width: 280px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 15px;
    outline: none;
    text-align: center;
  }
  #nameInput:focus { border-color: var(--accent); }
  #joinBtn {
    width: 100%; max-width: 280px;
    padding: 12px 16px;
    border-radius: 12px;
    border: none;
    background: var(--accent-2);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #joinBtn:hover { background: var(--accent); }
  #joinBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Header */
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: none;
    align-items: center;
    gap: 12px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  header.visible { display: flex; }
  .bt-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .bt-icon svg { width: 18px; height: 18px; }
  .header-text { flex: 1; min-width: 0; }
  .header-text h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .status-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .dot.connected { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.connecting { background: var(--warn); animation: pulse 1s infinite; }
  .dot.error { background: var(--err); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  #messages.visible { display: flex; }

  .bubble-row { display: flex; flex-direction: column; }
  .bubble-row.sent { align-items: flex-end; }
  .bubble-row.recv { align-items: flex-start; }
  .bubble-row.system { align-items: center; }

  .sender-label {
    font-size: 11px;
    color: var(--text-dim);
    margin: 0 4px 3px;
  }

  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .bubble-row.sent .bubble {
    background: linear-gradient(135deg, var(--sent), var(--accent-2));
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble-row.recv .bubble {
    background: var(--recv);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .bubble-row.system .bubble {
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 10px;
  }
  .timestamp {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 3px;
    display: block;
  }

  /* Composer */
  #composer {
    display: none;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel-2);
  }
  #composer.visible { display: flex; }
  #msgInput {
    flex: 1;
    resize: none;
    max-height: 100px;
    padding: 11px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
  }
  #msgInput:focus { border-color: var(--accent); }
  #msgInput::placeholder { color: var(--text-dim); }
  #sendBtn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent-2);
    color: white;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #sendBtn:hover { background: var(--accent); }
  #sendBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  #sendBtn svg { width: 18px; height: 18px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">

  <header id="header">
    <div class="bt-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z" stroke="white" stroke-width="1.6"/>
        <path d="M8 12h8M12 8v8" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>LAN Chat</h1>
      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Not connected</span>
      </div>
    </div>
  </header>

  <div id="joinScreen">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z" stroke="white" stroke-width="1.6"/>
        <path d="M8 12h8M12 8v8" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>LAN Chat</h1>
    <p>Everyone on this WiFi network can join. Pick a name to get started.</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="24" autocomplete="off">
    <button id="joinBtn">Join chat</button>
    <p id="joinError" style="display:none; color: var(--err); font-size: 13px;"></p>
  </div>

  <div id="messages"></div>

  <form id="composer">
    <textarea id="msgInput" rows="1" placeholder="Message..."></textarea>
    <button id="sendBtn" type="submit">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 11L21 3L13 21L11 13L3 11Z" fill="white"/>
      </svg>
    </button>
  </form>
</div>

<script>
(() => {
  const joinScreen = document.getElementById('joinScreen');
  const nameInput = document.getElementById('nameInput');
  const joinBtn = document.getElementById('joinBtn');
  const joinError = document.getElementById('joinError');
  const header = document.getElementById('header');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const messagesEl = document.getElementById('messages');
  const composer = document.getElementById('composer');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');

  let ws = null;
  let myName = '';

  function setStatus(state, label) {
    statusDot.className = 'dot ' + state;
    statusText.textContent = label;
  }

  function addMessage({ type, name, text, ts }) {
    const row = document.createElement('div');
    if (type === 'system') {
      row.className = 'bubble-row system';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
    } else {
      const isMine = name === myName;
      row.className = 'bubble-row ' + (isMine ? 'sent' : 'recv');
      if (!isMine) {
        const label = document.createElement('div');
        label.className = 'sender-label';
        label.textContent = name;
        row.appendChild(label);
      }
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      const time = document.createElement('span');
      time.className = 'timestamp';
      time.textContent = new Date(ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      bubble.appendChild(time);
      row.appendChild(bubble);
    }
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showJoinError(text) {
    joinError.textContent = text;
    joinError.style.display = 'block';
    joinBtn.disabled = false;
    joinBtn.textContent = 'Join chat';
  }

  let hasJoinedBefore = false;
  let connectTimeout = null;

  function connect(name) {
    myName = name;

    if (typeof WebSocket === 'undefined') {
      showJoinError('This browser does not support WebSockets.');
      return;
    }
    if (location.protocol === 'file:') {
      showJoinError('This page must be opened via http://, not as a local file. Run the server and open the printed URL.');
      return;
    }

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let socket;
    try {
      socket = new WebSocket(`${protocol}//${location.host}`);
    } catch (err) {
      showJoinError('Could not connect: ' + err.message);
      return;
    }
    ws = socket;

    setStatus('connecting', 'Connecting…');
    joinError.style.display = 'none';

    if (!hasJoinedBefore) {
      connectTimeout = setTimeout(() => {
        if (ws.readyState !== WebSocket.OPEN) {
          showJoinError('Could not reach the server. Check the host device is running "node server.js" and you are on the same WiFi network.');
          ws.close();
        }
      }, 5000);
    }

    ws.addEventListener('open', () => {
      clearTimeout(connectTimeout);
      hasJoinedBefore = true;
      ws.send(JSON.stringify({ type: 'join', name }));
      setStatus('connected', 'Connected');
      joinScreen.style.display = 'none';
      header.classList.add('visible');
      messagesEl.classList.add('visible');
      composer.classList.add('visible');
      msgInput.focus();
    });

    ws.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'presence') {
        statusText.textContent = `Connected · ${data.users.length} online`;
        return;
      }
      addMessage(data);
    });

    ws.addEventListener('close', () => {
      if (!hasJoinedBefore) return; // join-time failure is handled by the timeout/error path
      setStatus('error', 'Disconnected');
      addMessage({ type: 'system', text: 'Connection lost. Reconnecting…' });
      setTimeout(() => connect(myName), 2000);
    });

    ws.addEventListener('error', () => {
      if (!hasJoinedBefore) {
        clearTimeout(connectTimeout);
        showJoinError('Connection failed. Check the host device is running "node server.js" and you are on the same WiFi network.');
      } else {
        setStatus('error', 'Connection error');
      }
    });
  }

  joinBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) {
      showJoinError('Enter a name first.');
      nameInput.focus();
      return;
    }
    joinError.style.display = 'none';
    joinBtn.disabled = true;
    joinBtn.textContent = 'Connecting…';
    connect(name);
  });

  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinBtn.click();
  });

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = msgInput.value;
    if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'message', text }));
    msgInput.value = '';
    msgInput.style.height = 'auto';
  });

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      composer.requestSubmit();
    }
  });

  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
  });
})();
</script>
</body>
</html>
